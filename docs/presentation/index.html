<style>
:root, [data-theme="light"] {
  --bg: #f6f4ef; --panel: #efece4; --card: #ffffff; --card2: #f8f6f1; --card3: #ebe7dd;

  --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Hind Siliguri", Arial, sans-serif;
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #11161d; --panel: #151b23; --card: #18202a; --card2: #1d2631; --card3: #26313d;
  --line: #29333f; --line2: #37434f; --text: #e7ecf1; --text2: #c6ced7; --muted: #95a2af;
  --em: #67b7b4; --em2: #4fa29f; --em-soft: rgba(103,183,180,.13); --em-ink: #0c1a1b;

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
a { color: var(--em); }
button { font: inherit; }
.ic { flex: 0 0 auto; vertical-align: -0.2em; }

/* Layout */
.app { display: grid; grid-template-columns: 290px 1fr; height: 100vh; }
.side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }

.chap-title span.num { font-family: var(--serif); font-size: 15px; letter-spacing: 0; color: var(--muted); font-weight: 600; }
.toc button { display: block; width: 100%; text-align: left; border: 0; background: transparent; color: var(--text2); padding: 6px 12px 6px 34px; border-radius: 8px; font-size: 13.5px; cursor: pointer; position: relative; }
.toc button::before { content: ""; position: absolute; left: 16px; top: 50%; width: 6px; height: 6px; border-radius: 50%; transform: translateY(-50%); background: var(--line2); }

.toc button.on { background: var(--card); color: var(--em); font-weight: 600; box-shadow: var(--shadow); }
.toc button.on::before { background: var(--em); }
.toc button.intro { padding-left: 12px; }
.toc button.intro::before { display: none; }
.toc button.seen::before { background: var(--em); opacity: .45; }
.side-foot { padding: 14px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--muted); }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topline { height: 3px; background: var(--card3); }
.topline i { display: block; height: 100%; background: var(--em); transition: width .35s ease; }
.stage { flex: 1; overflow: auto; padding: 40px 56px 28px; }
.slide { max-width: 1120px; margin: 0 auto; animation: in .35s ease both; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.controls { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 28px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.btn { appearance: none; border: 1px solid var(--line2); background: var(--card); color: var(--text); padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { border-color: var(--em); color: var(--em); }
.btn.primary { background: var(--em); border-color: var(--em); color: var(--em-ink); }
.btn.primary:hover { background: var(--em2); color: var(--em-ink); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--text2); }
.btn:disabled { opacity: .4; cursor: default; }
.kbd { font-family: ui-monospace, monospace; font-size: 11px; padding: 1px 6px; border: 1px solid var(--line2); border-radius: 5px; background: var(--card); }
.notes { border-top: 1px solid var(--line); background: var(--card); padding: 14px 28px; font-size: 14px; color: var(--text2); display: none; max-height: 30vh; overflow: auto; }
.notes.on { display: block; }
.notes b { color: var(--gold); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; display: block; margin-bottom: 4px; }
.menu-btn { display: none; }
@media (max-width: 900px) {

  .side { position: fixed; inset: 0 30% 0 0; z-index: 20; transform: translateX(-100%); transition: transform .25s; box-shadow: var(--shadow); }
  .side.open { transform: none; }
  .menu-btn { display: inline-flex; }
  .stage { padding: 24px 18px; }
  .controls { padding: 10px 14px; }
  .controls .row { flex-wrap: nowrap; gap: 6px; }
  #pos { display: none; }
}

/* Slide typography */
.where { font-size: 11.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); display: flex; gap: 10px; align-items: center; }

h1, h2 { font-family: var(--serif); font-weight: 600; letter-spacing: -0.015em; line-height: 1.18; margin: 12px 0 10px; }
h1 { font-size: clamp(34px, 4.6vw, 56px); }
h2 { font-size: clamp(26px, 3vw, 36px); max-width: 920px; }
h3 { font-size: 17px; margin: 0 0 6px; font-weight: 650; }
.lede { font-size: clamp(16px, 1.5vw, 19px); color: var(--text2); max-width: 820px; margin: 0 0 26px; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }

.bar { height: 7px; border-radius: 99px; background: var(--card3); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--em); border-radius: inherit; transition: width .5s; }
ul.ticks { list-style: none; padding: 0; margin: 0; }
ul.ticks li { position: relative; padding-left: 22px; margin: 8px 0; color: var(--text2); }
ul.ticks li::before { content: ""; position: absolute; left: 3px; top: .62em; width: 7px; height: 7px; border-radius: 50%; background: var(--em); }
.note-box { border-left: 3px solid var(--gold); background: var(--gold-soft); padding: 12px 16px; border-radius: 0 10px 10px 0; font-size: 14px; color: var(--text2); }
.map { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-top: 30px; }
@media (max-width: 900px) { .map { grid-template-columns: 1fr; } }
.map button { display: flex; flex-direction: column; justify-content: flex-start; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 16px; cursor: pointer; color: var(--text); }

.map b { display: block; margin: 4px 0; }
.map span { font-size: 13px; color: var(--muted); }
.steps { display: flex; gap: 6px; margin-bottom: 18px; }
.steps button { flex: 1; height: 6px; border: 0; border-radius: 4px; background: var(--card3); cursor: pointer; padding: 0; }

.score { display: flex; gap: 4px; }

.theme-btn { border: 1px solid var(--line2); background: var(--card); border-radius: 9px; padding: 6px; cursor: pointer; color: var(--text2); display: inline-flex; }
@media print {
  .side, .controls, .notes, .topline { display: none !important; }
  .app { display: block; height: auto; }
  .stage { overflow: visible; padding: 0; }
  .slide { page-break-after: always; padding: 24px; animation: none; }
  .card { box-shadow: none; }
}

  $('#menu').onclick = function () { $('#side').classList.toggle('open'); };
  $('#theme').onclick = function () { theme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); };
  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(cur + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(cur - 1); }
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(S.length - 1);
    else if (e.key.toLowerCase() === 'n') $('#notes').classList.toggle('on');
  });
  var saved = 'light'; try { saved = localStorage.getItem('dishari.deck.theme') || 'light'; } catch (e) { /* ignore */ }
  theme(saved);
  go(cur);
})();
</script>
</body>
</html>
